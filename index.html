<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription UASZ</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-content: center;
            padding: 40px 20px;
        }
        .form-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
        h1 {
            color: #006633;
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
        }
        .subtitle {
            text-align: center;
            color: #555;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
        input[type="text"],
        input[type="date"],
        input[type="tel"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .phone-input-container {
            display: flex;
            align-items: center;
        }
        .prefix {
            background-color: #eee;
            border: 1px solid #ccc;
            border-right: none;
            padding: 10px;
            border-top-left-radius: 4px;
            border-bottom-left-radius: 4px;
            font-weight: bold;
            color: #555;
        }
        .phone-input-container input {
            border-top-left-radius: 0;
            border-bottom-left-radius: 0;
        }
        /* Style pour la section Wave */
        .wave-section {
            background-color: #e6f4ff;
            border: 2px dashed #1ac6ff;
            padding: 15px;
            border-radius: 6px;
            margin-top: 20px;
            margin-bottom: 20px;
            text-align: center;
        }
        .wave-btn {
            display: inline-block;
            background-color: #1ac6ff; /* Couleur officielle de Wave */
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 25px;
            font-weight: bold;
            margin-top: 10px;
            transition: background 0.3s;
        }
        .wave-btn:hover {
            background-color: #0099cc;
        }
        button[type="submit"] {
            width: 100%;
            padding: 12px;
            background-color: #006633;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button[type="submit"]:hover {
            background-color: #004d26;
        }
        .required {
            color: red;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h1>intégration au sein de l'amicale</h1>
    <p class="subtitle">Formulaire d'inscription des nouveaux bacheliers orientés à l'UASZ</p>

    <form action="#" method="POST">
        
        <div class="form-group">
            <label for="prenom">Prénom <span class="required">*</span></label>
            <input type="text" id="prenom" name="prenom" placeholder="Ex: Matar" required>
        </div>

        <div class="form-group">
            <label for="nom">Nom <span class="required">*</span></label>
            <input type="text" id="nom" name="nom" placeholder="Ex: DIENG" required>
        </div>

        <div class="form-group">
            <label for="date_naissance">Date de naissance</label>
            <input type="date" id="date_naissance" name="date_naissance">
        </div>

        <div class="form-group">
            <label for="telephone">Numéro de téléphone</label>
            <div class="phone-input-container">
                <span class="prefix">+221</span>
                <input type="tel" id="telephone" name="telephone" placeholder="77XXXXXXX" pattern="[0-9]{9}" maxlength="9">
            </div>
        </div>

        <div class="form-group">
            <label for="residence">Résidence</label>
            <input type="text" id="residence" name="residence" placeholder="Ex: Cap skirring">
        </div>

        <div class="wave-section">
            <p style="margin: 0; font-weight: bold; color: #004d66;">Frais Caution (Paiement Wave)</p>
            <p style="font-size: 12px; color: #555; margin: 5px 0;">Cliquez ci-dessous pour payer via l'application Wave</p>
            
            <a href="https://wave.me/pay?recipient=+221774792687&amount=1000&currency=XOF" class="wave-btn" target="_blank">
                📱 Payer avec Wave (5000 F)
            </a>
        </div>

        <button type="submit">Valider l'inscription</button>
        
    </form>
</div>

</body>
</html>
