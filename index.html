<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription UASZ</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-content: center;
            padding: 40px 20px;
        }
        .form-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
        h1 {
            color: #006633;
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
        }
        .subtitle {
            text-align: center;
            color: #555;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
        input[type="text"],
        input[type="date"],
        input[type="tel"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .phone-input-container {
            display: flex;
            align-items: center;
        }
        .prefix {
            background-color: #eee;
            border: 1px solid #ccc;
            border-right: none;
            padding: 10px;
            border-top-left-radius: 4px;
            border-bottom-left-radius: 4px;
            font-weight: bold;
            color: #555;
        }
        .phone-input-container input {
            border-top-left-radius: 0;
            border-bottom-left-radius: 0;
        }
        /* Style pour la section Wave */
        .wave-section {
            background-color: #e6f4ff;
            border: 2px dashed #1ac6ff;
            padding: 15px;
            border-radius: 6px;
            margin-top: 20px;
            margin-bottom: 20px;
            text-align: center;
        }
        .wave-btn {
            display: inline-block;
            background-color: #1ac6ff;
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 25px;
            font-weight: bold;
            margin-top: 10px;
            transition: background 0.3s;
        }
        .wave-btn:hover {
            background-color: #0099cc;
        }
        button[type="submit"] {
            width: 100%;
            padding: 12px;
            background-color: #006633;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button[type="submit"]:hover {
            background-color: #004d26;
        }
        .required {
            color: red;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h1>Intégration au sein de l'amicale</h1>
    <p class="subtitle">Formulaire d'inscription des nouveaux bacheliers orientés à l'UASZ</p>

    <form id="form-inscription">
        
        <div class="form-group">
            <label for="prenom">Prénom <span class="required">*</span></label>
            <input type="text" id="prenom" name="prenom" placeholder="Ex: Matar" required>
        </div>

        <div class="form-group">
            <label for="nom">Nom <span class="required">*</span></label>
            <input type="text" id="nom" name="nom" placeholder="Ex: DIENG" required>
        </div>

        <div class="form-group">
            <label for="date_naissance">Date de naissance <span class="required">*</span></label>
            <input type="date" id="date_naissance" name="date_naissance" required>
        </div>

        <div class="form-group">
            <label for="telephone">Numéro de téléphone WhatsApp <span class="required">*</span></label>
            <div class="phone-input-container">
                <span class="prefix">+221</span>
                <input type="tel" id="telephone" name="telephone" placeholder="77XXXXXXX" pattern="[0-9]{9}" maxlength="9" required>
            </div>
        </div>

        <div class="form-group">
            <label for="residence">Résidence <span class="required">*</span></label>
            <input type="text" id="residence" name="residence" placeholder="Ex: Cap skirring" required>
        </div>

        <!-- Section paiement Wave -->
        <div class="wave-section">
            <p style="margin: 0; font-weight: bold; color: #004d66;">Étape 1 : Paiement des Frais (Wave)</p>
            <p style="font-size: 12px; color: #555; margin: 5px 0;">Effectuez le transfert Wave puis validez l'inscription.</p>
            
            <a href="https://pay.wave.com/m/VOTRE_LIEN_WAVE_ICI" target="_blank" class="wave-btn">
                Payer via Wave 📱
            </a>
        </div>

        <p style="font-size: 12px; color: #666; text-align: center; margin-bottom: 10px;">
            Étape 2 : Cliquez ci-dessous pour valider et envoyer votre fiche par WhatsApp.
        </p>

        <button type="submit">Valider et confirmer sur WhatsApp</button>
        
    </form>
</div>

<script>
  // Mettez ici le numéro du bureau / amicale qui reçoit les inscriptions
  const NUMERO_AMICALE = "221770000000"; 

  document.getElementById('form-inscription').addEventListener('submit', function(e) {
    e.preventDefault();
    
    // Récupération des données du formulaire
    const prenom = document.getElementById('prenom').value;
    const nom = document.getElementById('nom').value;
    const dateNaissance = document.getElementById('date_naissance').value;
    const telephone = document.getElementById('telephone').value; // Le numéro saisi
    const residence = document.getElementById('residence').value;

    // Construction du message WhatsApp avec le numéro de l'étudiant inclus
    const message = `*DEMANDE DE VALIDATION D'INSCRIPTION*\n\n` +
                    `👤 *Nom & Prénom :* ${prenom} ${nom}\n` +
                    `📅 *Date de naissance :* ${dateNaissance}\n` +
                    `📱 *Numéro WhatsApp Étudiant :* +221${telephone}\n` +
                    `🏠 *Résidence :* ${residence}\n\n` +
                    `✅ *Statut :* Paiement Wave effectué.\n` +
                    `Merci de valider mon dossier d'intégration.`;

    // Lien de redirection vers WhatsApp
    const whatsappUrl = `https://wa.me/${NUMERO_AMICALE}?text=${encodeURIComponent(message)}`;

    // Redirection directe
    window.location.href = whatsappUrl;
  });
</script>

</body>
</html>
